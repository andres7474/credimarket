[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credimarket-ml"
version = "1.0.0"
description = "Características compartidas del modelo de riesgo de CrediMarket"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy", "scikit-learn"]

[tool.setuptools]
packages = ["credimarket_ml"]
